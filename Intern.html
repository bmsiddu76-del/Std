<!DOCTYPE html>
<html>
<head>
    <title>Company</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>InternConnect</h1>
    <p>Company Internship Requirements</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="student.html">Student</a>
    <a href="company.html">Company</a>
    <a href="selection.html">Find Students</a>
</nav>

<h2>Company Registration</h2>

<form>

    <label>Company Name:</label><br>

    <input type="text"
           placeholder="Enter company name">

    <br><br>

    <label>Email:</label><br>

    <input type="email"
           placeholder="Enter company email">

    <br><br>

    <label>Internship Domain:</label><br>

    <select>

        <option>Web Development</option>
        <option>App Development</option>
        <option>Data Science</option>
        <option>Cyber Security</option>
        <option>Software Development</option>

    </select>

    <br><br>

    <label>Required Skills:</label><br>

    <input type="text"
           placeholder="Example: HTML, JavaScript">

    <br><br>

    <label>Minimum CGPA:</label><br>

    <input type="text"
           placeholder="Example: 7.0">

    <br><br>

    <label>Internship Duration:</label><br>

    <select>
        <option>1 Month</option>
        <option>2 Months</option>
        <option>3 Months</option>
        <option>6 Months</option>
    </select>

    <br><br>

    <label>Number of Students Required:</label><br>

    <input type="text">

    <br><br>

    <input type="submit" value="Submit Requirements">

</form>

<footer>
    <p>© 2026 InternConnect</p>
</footer>

</body>
</html>
