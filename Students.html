<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>InternConnect</h1>
    <p>Student Registration</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="student.html">Student</a>
    <a href="company.html">Company</a>
    <a href="selection.html">Find Students</a>
</nav>

<h2>Student Registration Form</h2>

<form>

    <label>Name:</label><br>
    <input type="text" placeholder="Enter your name">
    <br><br>

    <label>Email:</label><br>
    <input type="email" placeholder="Enter your email">
    <br><br>

    <label>Phone:</label><br>
    <input type="text" placeholder="Enter phone number">
    <br><br>

    <label>College:</label><br>
    <input type="text" placeholder="Enter college name">
    <br><br>

    <label>Degree:</label><br>
    <input type="text" placeholder="Example: BCA">
    <br><br>

    <label>CGPA:</label><br>
    <input type="text" placeholder="Enter CGPA">
    <br><br>

    <label>Skills:</label><br>
    <input type="text" placeholder="Example: HTML, CSS, Java">
    <br><br>

    <label>Interested Domain:</label><br>

    <select>
        <option>Web Development</option>
        <option>App Development</option>
        <option>Data Science</option>
        <option>Cyber Security</option>
        <option>Software Development</option>
    </select>

    <br><br>

    <label>About You:</label><br>

    <textarea rows="5" cols="30"
        placeholder="Write about yourself"></textarea>

    <br><br>

    <input type="submit" value="Register">

</form>

<footer>
    <p>© 2026 InternConnect</p>
</footer>

</body>
</html>
